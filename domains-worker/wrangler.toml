name = "erispulse-plugin-domains"
main = "src/worker.js"
compatibility_date = "2026-01-01"
workers_dev = false

# 独立于工作台 Worker 的原因：Workers Assets 的边缘缓存按路径共享（忽略主机名），
# 工作台 Worker 的 ASSETS 绑定会把 workbench 首页缓存泄漏到 plugin-* 主机名的 `/` 上。
# 本 Worker 无 Assets 绑定，物理上无法触达那套缓存。
# 托管域名的精确路由（plugin-<label>.erisdev.com/*）由 Workbench 在申请时动态创建并指向本 Worker。

routes = [
    { pattern = "plugin.erisdev.com/*", zone_name = "erisdev.com" },
]

[[d1_databases]]
binding = "DB"
database_name = "erispulse-workbench"
database_id = "e6a2b9b1-863c-4168-804b-87f8b23f61b0"
